// We created a div over here we could just write a function and pass array of colors according to index and function will create new div's
<script>
    const div = document.createElement('div')
    console.log(div);
    div.id = Math.round(Math.random() * 10 + 1)
    div.setAttribute("My_title" , "Jay's title")
    div.style.backgroundColor = 'skyblue';
    // div.style.color = 'red'
    div.style.padding = '10px'

    // div.innerText = "Jay Dayama"; this Overwritres
    const addtext = document.createTextNode("Jay Dayama");
    div.appendChild(addtext);
    
    document.body.appendChild(div);// actually attaches object to our document
</script>
