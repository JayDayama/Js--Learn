<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search GitHub Users</title>
    <style>
        body {
            background-color: #212121;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            padding-top: 60px;
        }

        .searchuser {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        #name {
            font-size: 18px;
            margin-bottom: 10px;
            display: inline-block;
        }

        .guessField {
            padding: 10px;
            width: 250px;
            border-radius: 5px;
            border: 1px solid #444;
            background-color: #2c2c2c;
            color: white;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .guessSubmit {
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            background-color: #4CAF50;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .guessSubmit:hover {
            background-color: #45a049;
        }

        .card {
            background-color: #2c2c2c;
            border-radius: 10px;
            padding: 20px;
            margin: 20px auto;
            max-width: 300px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .card img {
            border-radius: 50%;
            margin-bottom: 10px;
        }

        .card h2 {
            font-size: 20px;
            margin: 5px 0;
        }

        .card h3 {
            font-size: 16px;
            color: #ccc;
            margin: 5px 0;
        }

        .card h4 {
            font-size: 14px;
            color: #aaa;
            font-weight: normal;
            margin: 5px 0;
        }
    </style>
</head>
<body style = 'background-color: #212121;'>
    <div class="searchuser">
        <form class="form" style = "text-align: center;">
            <label for="guessField" id="name" style = "color : white ">Enter GitHub UserName</label>
            </br>
            <input type="text" id="username" class="guessField">
            </br>
            <input type="submit" id="subt" value="Submit guess" class="guessSubmit">
        </form>
        <div id="cards"></div>
    </div>
</body>
<script>
    const searchUser = document.querySelector('#username');
    const submit = document.querySelector('#subt');
    const cards = document.querySelector('#cards');
    submit.addEventListener('click' , function(e){
        e.preventDefault();
        cards.innerHTML = '';

        const UserName = searchUser.value;
        let url = `https://api.github.com/users/${UserName}`;
        fetch(url)
        .then( (response) => {
            if (!response.ok) {
                throw new Error('User Not Found'); 
            }
            return response.json();
        } )
        .then( (data) => {
            const newdiv = document.createElement('div');
            newdiv.className = 'card';
            cards.appendChild(newdiv);

            const image = document.createElement('img');
            image.src = data.avatar_url;
            image.style.width = '200px';
            image.style.borderRadius = '50%';
            newdiv.appendChild(image);


            const Name = document.createElement('h2');
            Name.innerHTML = `Name : ${data.name}`
            newdiv.appendChild(Name);

            const followerscnt = document.createElement('h3');
            followerscnt.innerHTML = `Total Followers : ${data.followers}`;
            newdiv.appendChild(followerscnt);

            const Bio = document.createElement('h4');
            Bio.innerHTML = `Bio : ${data.bio}`
            newdiv.appendChild(Bio);

        } )
        .catch((error) => alert(error.message))
        // console.log(url)
        // console.log(UserName);
    })
</script>
</html>
